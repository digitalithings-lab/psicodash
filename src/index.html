<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Florece · Panel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Aplica el tema guardado antes de pintar, para que el modo oscuro no parpadee en claro.
    (function () {
      try {
        var mode = localStorage.getItem('florece.panel.theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
